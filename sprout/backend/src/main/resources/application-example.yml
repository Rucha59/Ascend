# Copy relevant values into real environment variables (or a local .env loaded by your shell) —
# do not commit actual secrets. See README.md for the full list.
#
# DB_NAME=sprout
# DB_USERNAME=postgres
# DB_PASSWORD=your-local-postgres-password
# If the password contains #, escape it as \# because .env is loaded as properties.
# JWT_SECRET=replace-with-a-long-random-string-at-least-32-characters
# JWT_EXPIRATION_MS=86400000
# CORS_ALLOWED_ORIGIN=http://localhost:5173
# GOOGLE_CLIENT_ID=your-google-oauth-client-id
# GOOGLE_CLIENT_SECRET=your-google-oauth-client-secret
# OAUTH2_FRONTEND_REDIRECT_URI=http://localhost:5173/oauth2/callback
